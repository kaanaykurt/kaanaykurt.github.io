project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "blogs/**/*.qmd"
  resources:
    - fonts/

execute:
  freeze: auto

website:
  title: "Kaan Aykurt"
  description: "Kaan Aykurt, PhD candidate at the Chair of Communication Networks, TU Munich. Research on AI for networking and networking for AI: LLM agents for network management, benchmarking, and communication in large-scale ML systems."
  site-url: https://kaanaykurt.me
  favicon: favicon.svg
  image: files/profile.jpeg
  open-graph: true
  twitter-card: true
  search: false
  navbar:
    right:
      - text: Home
        href: index.qmd
      - text: CV
        href: cv.qmd
      - text: Publications
        href: publications.qmd
      - text: Teaching
        href: teaching.qmd
      - text: Blog
        href: blog.qmd
      - icon: moon
        href: "#theme-toggle"
  page-footer:
    center: "© 2026 Kaan Aykurt. Licensed under [CC BY 4.0.](https://creativecommons.org/licenses/by/4.0/)"

format:
  html:
    toc: true
    mainfont: "Lato"
    monofont: "Fira Mono"
    theme: theme.scss
    css:
      - fonts.css
      - styles.css
    include-in-header: theme-init.html
    include-after-body: theme-toggle.html
