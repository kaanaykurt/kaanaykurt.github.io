      title={Improving Network Clock Synchronization by Marking Congestion},
      author={Deshpande, Yash and Vogel, Quirin and Becker, Laura and Aykurt, Kaan and Kellerer, Wolfgang},
      year={2026},
      eprint={2604.12961},
      archivePrefix={arXiv},
      primaryClass={cs.NI}
    }
- key: aykurt2026routemind
  title: 'RouteMind: An LLM-Based Framework for Policy-Aware Inter-Domain Routing'
  authors:
  - K. Aykurt
  - I. H. Aksu
  - W. Kellerer
  venue: IEEE GLOBECOM
  year: 2026
  pdf: https://mediatum.ub.tum.de/doc/1861162/document.pdf
  code: https://github.com/kaanaykurt/routemind
  abstract: |-
    The decentralized and policy-oriented nature of inter-domain routing presents a significant challenge for the realization of autonomous network management. While Large Language Models (LLMs) are increasingly used for static configuration generation, their viability as dynamic, policy-aware Autonomous System (AS) agents remains unexplored. To bridge this gap, we propose RouteMind, an LLM-based framework that utilizes AS agents to autonomously manage inter-domain routing. By deploying RouteMind across CAIDA-derived topologies within an emulated network environment, we demonstrate that these agents can successfully synthesize runnable BGP configurations and enforce policies.
